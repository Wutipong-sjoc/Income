<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sidebar + WASM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>เมนู</h2>
    <button onclick="openTab('home')">🏠 Home</button>
    <button onclick="openTab('add')">➕ เพิ่มข้อมูล</button>
    <button onclick="openTab('login')">🔐 Login</button>
  </div>

  <div class="content">

    <!-- HOME -->
    <div id="home" class="tab active">
      <h1>🏠 Home</h1>
      <p>ยินดีต้อนรับ</p>
    </div>

    <!-- ADD -->
    <div id="add" class="tab">
      <h1>➕ เพิ่มข้อมูล</h1>

      <input type="file" id="imgInput" multiple>
      <button onclick="convert()">แปลง</button>
      <button onclick="convertdown()">Download</button>

      <!-- ✅ กล่องแสดงผล -->
      <textarea 
        id="outputBox" 
        rows="12"
        style="
          width:100%;
          margin-top:10px;
          font-family:monospace;
          background:#111;
          color:#0f0;
          padding:10px;
        ">
      </textarea>
    </div>

    <!-- LOGIN -->
    <div id="login" class="tab">
      <h1>🔐 Login</h1>
      <input placeholder="Email"><br><br>
      <input type="password" placeholder="Password">
    </div>

  </div>
</div>

<!-- scripts -->
<script src="engine_myrun.js"></script>
<script src="main.js"></script>

</body>
</html>
