<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

<body>

<div class="layout">

  <div class="content">

    <div id="add" class="tab">
      <h1>➕ เพิ่มข้อมูล</h1>

      <!-- <input type="file" id="imgInput"> -->

      <button onclick="convert()">แปลง</button>
      <button onclick="convertdown()">Download</button>

      <!-- <input type="file" id="pgmInput" accept=".pgm" />
      <button onclick="loadPGM()">Run PGM</button> -->
      
    </div>

    <div id="login" class="tab">
      <h1>🔐 Login</h1>
      <input placeholder="Email"><br><br>
      <input type="password" placeholder="Password">
    </div>

  </div>
</div>
