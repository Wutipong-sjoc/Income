<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Income</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>Menu</h2>
    <button onclick="openTab('Dashboard')">📍 Dashboard</button>
    <button onclick="openTab('add')">➕ เพิ่มข้อมูล</button>
    <button id="btnStockDetails" onclick="openTab('StockDetails')">📉 Stock Details</button>

    <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
      <div id="sidebarUser" style="font-size:12px;">
        ❌ ยังไม่ได้ login
      </div>
      <button onclick="logout()">Logout</button>
      <button id="loginBtn1" onclick="openTab('login')">🔐 Login</button>
    </div>
  </div>

  <div class="content">

    <div id="Dashboard" class="tab active">
      <h1>📍 Dashboard</h1>

      <div id="summaryCards" style="display:flex; gap:16px; flex-wrap:wrap; margin-top:20px;">
        <div class="summary-card" style="background:#1e5f7a; color:white; padding:16px 24px; border-radius:10px; min-width:140px; text-align:center;">
          <div style="font-size:13px; opacity:0.8;">รายได้รวม</div>
          <div id="totalRevenue" style="font-size:28px; font-weight:bold;">—</div>
          <div style="font-size:11px; opacity:0.6;">บาท</div>
        </div>
        <div class="summary-card" style="background:#7a3e1e; color:white; padding:16px 24px; border-radius:10px; min-width:140px; text-align:center;">
          <div style="font-size:13px; opacity:0.8;">ต้นทุนรวม</div>
          <div id="totalCost" style="font-size:28px; font-weight:bold;">—</div>
          <div style="font-size:11px; opacity:0.6;">บาท</div>
        </div>
        <div class="summary-card" style="background:#1e7a4a; color:white; padding:16px 24px; border-radius:10px; min-width:140px; text-align:center;">
          <div style="font-size:13px; opacity:0.8;">กำไรรวม</div>
          <div id="totalProfit" style="font-size:28px; font-weight:bold;">—</div>
          <div style="font-size:11px; opacity:0.6;">บาท</div>
        </div>
      </div>

      <div style="margin-top:24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <label style="font-size:13px;">ช่วงวันที่:</label>
        <input type="date" id="chartFrom">
        <span>—</span>
        <input type="date" id="chartTo">
        <button onclick="loadChartData()">🔍 โหลด</button>
        <button id="btnDay" onclick="setChartMode('day')" style="background:#1e5f7a; color:white;">📅 รายวัน</button>
        <button id="btnMonth" onclick="setChartMode('month')">🗓️ รายเดือน</button>
      </div>

      <div style="margin-top:24px; background:#111; border-radius:12px; padding:20px;">
        <h3 style="color:#aaa; margin:0 0 16px 0; font-size:14px;">📊 รายได้ / ต้นทุน / กำไร รายวัน</h3>
        <canvas id="incomeChart" height="100"></canvas>
      </div>

      <div id="chartStatus" style="margin-top:12px; color:#888; font-size:13px;"></div>

      <div style="margin-top:24px; background:#111; border-radius:12px; padding:20px;">
        <h3 style="color:#aaa; margin:0 0 16px 0; font-size:14px;">📦 จำนวนสินค้าที่ขายได้ รายวัน</h3>
        <canvas id="qtyChart" height="100"></canvas>
      </div>
    </div>

    <div id="add" class="tab">
      <h1>➕ เพิ่มข้อมูล</h1>

      <input type="file" id="imgInput" multiple>
      <button onclick="processTwice()" style="background:#1e5f7a; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px;">📑 Process</button>
      <button onclick="saveData()" style="background:#1e7a4a; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px;">💾 Save</button>
      <button onclick="clearAllSlips()" style="background:#8b1e3f; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px;">🗑 Clear all</button>
      <button id="btnManual" onclick="document.getElementById('myModal').style.display='flex'" style="background:#7a6f1e; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px;">🙌 Manual</button>

      <div style="margin-top:15px;">
        <label>วัน เดือน ปี:</label><br>
        <input type="date" id="dateInput">
      </div>

      <div id="globalCostDiv" style="margin-top:12px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
          <label style="font-size:16px; color:#aaa; font-weight:bold;">💰 ต้นทุน (ทุกบิล):</label>
          <button onclick="addCostRow()" style="background:#5f6368; color:white; border:1px solid #4b4f54; padding:10px 22px; border-radius:10px; cursor:pointer; font-size:16px; font-weight:700; min-width:92px; box-shadow:0 2px 8px rgba(0,0,0,0.12);">เพิ่ม</button>
        </div>
        <div id="costRows" style="display:flex; flex-direction:column; gap:12px;"></div>
      </div>

      <div id="slipContainer" style="margin-top:20px;"></div>

      <div id="myModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:999;">
        <div style="background:#1a1a1a; padding:24px; border-radius:12px; min-width:300px;">
          <h3 style="margin:0 0 16px; color:white;">เพิ่มข้อมูล Manual</h3>

          <input type="number" id="popPrice" placeholder="ราคา" style="width:100%; margin-bottom:10px;"><br>
          <select id="popProduct" style="width:100%; margin-bottom:10px;">
            <option>กำลังโหลด...</option>
          </select><br>
          <input type="number" id="popCost" placeholder="ต้นทุน" style="width:100%; margin-bottom:16px;">

          <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button onclick="document.getElementById('myModal').style.display='none'">ยกเลิก</button>
            <button onclick="saveModal()">💾 Save</button>
          </div>
        </div>
      </div>
    </div>

    <div id="login" class="tab">
      <h1>🔐 Login</h1>

      <input id="email" placeholder="Email"><br><br>
      <input id="password" type="password" placeholder="Password"><br><br>

      <div style="display:flex; gap:10px;">
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
      </div>

      <p id="userStatus"></p>
    </div>

    <div id="StockDetails" class="tab">
      <h1>📉 Stock Details</h1>
      <p style="color:#888; font-size:13px; margin-top:8px;">แก้ไขข้อมูล stock แล้วกด 💾 Update เพื่อบันทึก</p>
      <div id="stockTableContainer" style="margin-top:20px;">
        <p style="color:#aaa;">กำลังโหลด...</p>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="engine_myrun.js"></script>
<script type="module" src="main.js"></script>

</body>
</html>
