<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Income</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>เมนู</h2>
    <button onclick="openTab('home')">🏠 Home</button>
    <button onclick="openTab('add')">➕ เพิ่มข้อมูล</button>
    <!-- <button onclick="openTab('login')">🔐 Login</button> -->

    <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
      <div id="sidebarUser" style="font-size:12px;">
        ❌ ยังไม่ login
      </div>

      <!-- <button onclick="login()">Login</button> -->
       <button onclick="logout()">Logout</button>
      <button id="loginBtn1" onclick="openTab('login')">🔐 Login</button>
    </div>
  </div>

  <div class="content">

    <!-- HOME -->
    <div id="home" class="tab active">
      <h1>🏠 Home</h1>
      <p>ยินดีต้อนรับ</p>
    </div>

    <!-- ADD -->
    <div id="add" class="tab">
      <h1>➕ เพิ่มข้อมูล</h1>

      <input type="file" id="imgInput" multiple>
      <button onclick="convert()">Process</button>
      <button onclick="saveData()">💾 Save</button>

      <!-- วันที่ -->
      <div style="margin-top:15px;">
        <label>วัน เดือน ปี:</label><br>
        <input type="date" id="dateInput">
      </div>

      <!-- ตาราง -->
      <div id="slipContainer" style="margin-top:20px;"></div>

    </div>

    <!-- LOGIN -->
    <div id="login" class="tab">
      <h1>🔐 Login</h1>

      <input id="email" placeholder="Email"><br><br>
      <input id="password" type="password" placeholder="Password"><br><br>

      <div style="display:flex; gap:10px;">
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
      </div>

      <p id="userStatus"></p>
    </div>

  </div>
</div>

<script src="engine_myrun.js"></script>
<script type="module" src="main.js"></script>

</body>
</html>
